<title>Shot Caller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, clapperboard slate header, bottom tab bar (Ideas → Plan → Field → Library) */
:root {
  --bg: #EDF0EE; --surface: #FFFFFF; --ink: #14181A; --muted: #59635E; --line: #D2D8D4;
  --tally: #BF2E37; --go: #2B7552; --slate: #1C2225; --slate-ink: #F1F4F2; --chip: #E2E7E4;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101315; --surface: #191E20; --ink: #E8ECE9; --muted: #95A09A; --line: #2B3235;
  --tally: #EE5A61; --go: #58B688; --slate: #242B2E; --slate-ink: #F1F4F2; --chip: #232A2C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101315; --surface: #191E20; --ink: #E8ECE9; --muted: #95A09A; --line: #2B3235;
  --tally: #EE5A61; --go: #58B688; --slate: #242B2E; --slate-ink: #F1F4F2; --chip: #232A2C; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { margin: 0; text-wrap: balance }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px }

/* Slate header */
.slate { background: var(--slate); color: var(--slate-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 0 14px }
.sticks { height: 14px; margin-inline: -16px; background: repeating-linear-gradient(-45deg, var(--slate-ink) 0 14px, var(--slate) 14px 28px) }
.slate-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px }
.brand { font: 800 34px/0.95 var(--f-display); letter-spacing: .01em; text-transform: uppercase }
.brand b { color: var(--tally) }
.slate-meta { font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .75; text-align: right }
.mode { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; opacity: .8 }
.mode i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--go); margin-right: 6px; font-style: normal }
.mode.off i { background: #A9A9A0 }

/* Sections */
.view { display: grid; gap: 18px; padding-top: 18px }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.h-display { font: 800 30px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.h-sec { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em }
.muted { color: var(--muted) }
.small { font-size: 13px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.stack { display: grid; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }

details.lane > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px }
details.lane > summary::-webkit-details-marker { display: none }
details.lane > summary .caret { font: 500 12px var(--f-mono); color: var(--muted) }
details.lane[open] > summary { margin-bottom: 12px }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 440px) { .fields { grid-template-columns: 1fr } }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
input.t, select.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 11px; font-size: 15px; color: var(--ink) }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px }
.btn.primary { background: var(--tally); border-color: var(--tally); color: #fff }
.btn.go { background: var(--go); border-color: var(--go); color: #fff }
.btn.ghost { background: transparent }
.btn.block { width: 100% }
.btn:disabled { opacity: .55; cursor: default }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13px }

.status { font: 500 12px/1.4 var(--f-mono); color: var(--muted); display: flex; gap: 8px; align-items: center }
.rec { width: 9px; height: 9px; border-radius: 50%; background: var(--tally); animation: blink 1s steps(2) infinite }
@keyframes blink { 50% { opacity: .15 } }
@media (prefers-reduced-motion: reduce) { .rec { animation: none } }
.note { border-left: 3px solid var(--tally); padding: 8px 12px; background: var(--surface); border-radius: 0 8px 8px 0; font-size: 13px }

/* Idea cards */
.ideas { display: grid; gap: 12px }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; min-width: 0 }
.meta { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px }
.tag { font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--muted) }
.tag.ex { background: transparent; border: 1px dashed var(--muted) }
.idea h3 { font: 700 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.hook { font-size: 16px; font-weight: 500; line-height: 1.35 }
.hook::before { content: "“" } .hook::after { content: "”" }

/* Plan */
.plan-head { background: var(--slate); color: var(--slate-ink); border-radius: 10px; overflow: hidden }
.plan-head .sticks { margin: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--slate-ink) 0 10px, var(--slate) 10px 20px) }
.plan-head .in { padding: 14px; display: grid; gap: 10px }
.plan-head h2 { font: 800 30px/1 var(--f-display); text-transform: uppercase }
.slate-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(241,244,242,.25) }
.slate-grid > div { padding: 8px 10px; border-right: 1px solid rgba(241,244,242,.25); min-width: 0 }
.slate-grid > div:last-child { border-right: 0 }
.slate-grid .k { font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .65 }
.slate-grid .v { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere }

.beats { display: grid }
.beat { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.beat:first-child { border-top: 0; padding-top: 0 }
.tc { font: 500 12px/1.5 var(--f-mono); color: var(--tally); font-variant-numeric: tabular-nums }
.beat .lbl { font-weight: 600 }
.beat .vis { font-size: 13px; color: var(--muted) }
.beat > div { min-width: 0 }

.shots { display: grid }
.shot { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start }
.shot:first-child { border-top: 0; padding-top: 0 }
.shot-no { font: 500 12px var(--f-mono); color: var(--muted); display: grid; gap: 4px; justify-items: start; font-variant-numeric: tabular-nums }
.size { font: 700 15px var(--f-display); letter-spacing: .04em; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 3px }
.roll { font: 500 10px var(--f-mono); text-transform: uppercase; letter-spacing: .06em }
.roll.b { color: var(--go) } .roll.a { color: var(--tally) }
.shot > div { min-width: 0 }
ul.list { margin: 0; padding-left: 18px; display: grid; gap: 4px }
.copybox { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-wrap: anywhere }

/* Field mode */
.bigline { font: 800 28px/1.05 var(--f-display); text-transform: uppercase }
.progress { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden }
.progress > i { display: block; height: 100%; background: var(--go); transition: width .25s }
.check { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; min-width: 0 }
.check input { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--go) }
.check.done { opacity: .55 }
.check.done .desc { text-decoration: line-through }
.check.next { border-color: var(--tally); box-shadow: 0 0 0 1px var(--tally) }
.check .desc { font-size: 16px; font-weight: 500 }
.check > div { min-width: 0 }

/* Library */
.lib-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line) }
.lib-item:first-child { border-top: 0 }
.lib-item > div { min-width: 0 }
.lib-item b { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; display: block }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); font-size: 14px }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar) }
nav.tabs button { background: none; border: 0; cursor: pointer; display: grid; place-content: center; gap: 2px; color: var(--muted); font: 600 11px var(--f-body); min-width: 0 }
nav.tabs button .k { font: 700 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
nav.tabs button[aria-current="page"] { color: var(--ink) }
nav.tabs button[aria-current="page"] .k { color: var(--tally) }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }

/* Industries */
.lanebar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px }
.lane-chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; display: grid; gap: 1px; max-width: 70vw }
.lane-chip b { font: 700 16px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lane-chip span { font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.lane-chip[aria-pressed="true"] { border-color: var(--tally); box-shadow: inset 0 -3px 0 var(--tally) }
.lane-chip.add { border-style: dashed; color: var(--muted) }
.inline-add { display: flex; gap: 8px }
.inline-add input { flex: 1; min-width: 0 }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em }
.crumbs button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--muted); font: inherit; text-transform: inherit; letter-spacing: inherit; text-decoration: underline; text-underline-offset: 3px }
.crumbs .cur { color: var(--ink) }
.subs { display: grid; gap: 10px }
.sub { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0 }
.sub h3 { font: 700 20px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.tag.hot { background: var(--tally); color: #fff }
.tag.reg { background: transparent; border: 1px solid var(--tally); color: var(--tally) }
.tag.lane { background: var(--ink); color: var(--bg) }
.focus-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 13px }
.focus-chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px }
.lane-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.lane-row:first-child { border-top: 0 }
.lane-row > div { min-width: 0 }
.lane-row b { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; display: block }

/* Month, patterns, trends */
.seg { display: flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 3px }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 7px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); min-height: 36px }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14) }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; display: grid; gap: 2px; align-content: start }
.tile .k { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.tile .v { font: 800 30px/1.05 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.tile .s { font-size: 12px; color: var(--muted) }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.monthnav .h-display { font-size: 28px }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px }
.cal .dow { font: 500 10px var(--f-mono); text-align: center; color: var(--muted); padding-bottom: 2px }
.cal .day { aspect-ratio: 1 / 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 4px; display: grid; align-content: space-between; justify-items: start; cursor: pointer; min-width: 0; font: 500 12px var(--f-mono); color: var(--ink) }
.cal .day.blank { visibility: hidden }
.cal .day.today { border-color: var(--tally); border-width: 2px }
.cal .day[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.dots { display: flex; gap: 2px; flex-wrap: wrap }
.dot { width: 6px; height: 6px; border-radius: 50% }
.dot.shoot { background: var(--tally) } .dot.post { background: var(--go) }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center }
.legend .dot { display: inline-block; margin-right: 5px }
.bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--go) }
.bar.tally > i { background: var(--tally) }
.agenda { display: grid }
.agenda button { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; color: var(--ink); align-items: start }
.agenda button:first-child { border-top: 0 }
.agenda button > div { min-width: 0 }
.tag.shoot { background: var(--tally); color: #fff } .tag.post { background: var(--go); color: #fff }
.tag.pod { background: transparent; border: 1px solid var(--ink); color: var(--ink) }
.client { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line) }
.client:first-child { border-top: 0; padding-top: 0 }
.client b.name { font: 700 20px/1.1 var(--f-display); text-transform: uppercase }
.deliv { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; font-size: 13px }
.deliv > span:last-child { font-variant-numeric: tabular-nums; color: var(--muted) }
.scroll { overflow-x: auto }
table.pat { width: 100%; border-collapse: collapse; font-size: 13px }
table.pat th { text-align: left; font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap }
table.pat td { padding: 7px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle }
table.pat .n { text-align: right; white-space: nowrap }
table.pat .barcell { width: 18%; min-width: 44px }
table.pat td:first-child { min-width: 104px }
.low { color: var(--muted); font-size: 11px }
.trend { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line) }
.trend:first-child { border-top: 0; padding-top: 0 }
.trend h3 { font: 700 20px/1.1 var(--f-display); text-transform: uppercase }
.qs { margin: 0; padding-left: 20px; display: grid; gap: 6px }
</style>

<div class="wrap">
  <header class="slate">
    <div class="sticks"></div>
    <div class="slate-row">
      <div class="brand">Shot<b>·</b>Caller</div>
      <div class="slate-meta"><div id="slate-date"></div><div>Pre-pro → Field</div></div>
    </div>
    <div class="mode off" id="mode"><i></i><span>Starting up</span></div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const str = (v, d = "") => (typeof v === "string" ? v : v == null ? d : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];
const pad = n => String(n).padStart(2, "0");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const same = (a, b) => str(a).toLowerCase() === str(b).toLowerCase();
const fmtRun = s => { s = Math.max(0, Math.round(+s || 0)); return s >= 60 ? `${Math.floor(s / 60)}:${pad(s % 60)}` : `${s}s`; };
const clone = o => JSON.parse(JSON.stringify(o));
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtDay = s => s ? parseYmd(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "";
const monthLabel = m => parseYmd(m + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" });
const shiftMonth = (m, n) => { const d = parseYmd(m + "-01"); d.setMonth(d.getMonth() + n); return ymd(d).slice(0, 7); };
const money = n => "$" + Math.round(+n || 0).toLocaleString();
const num = n => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n)); };
const daysAgo = ts => Math.max(0, Math.floor((Date.now() - (ts || 0)) / 864e5));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
async function copy(text, el) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Text selected. Copy it from here."); }
}
const seg = (options, cur, onpick) => h("div", { class: "seg", role: "group" }, options.map(([k, label]) => h("button", { "aria-pressed": String(cur === k), onclick: () => onpick(k) }, label)));

}

// Don't re-render while someone is typing (db echoes would steal focus).
store.listeners.push(() => { const a = document.activeElement; if (a && a.matches && a.matches("input.t, select.t, textarea.t")) return; render(); });

const d = new Date();
$("#slate-date").textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
render(); setMode();

(async () => {
  await store.init();
  await migrate();
  try { sample = window.claude && window.claude.use ? await claude.use("sample") : null; } catch { sample = null; }
  setMode(); render();
})();
})();
</script>
