/* Layout: one-column phone app, clapperboard slate header, bottom tab bar (Ideas → Plan → Field → Library) */
:root {

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

:root[data-theme="dark"] {

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px }

.btn.go { background: var(--go); border-color: var(--go); color: #fff }

.beats { display: grid }
.beat { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }

.shots { display: grid }

.shot:first-child { border-top: 0; padding-top: 0 }

.copybox { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-wrap: anywhere }

.check .desc { font-size: 16px; font-weight: 500 }

.empty { text-align: center; padding: 22px 12px; color: var(--muted); font-size: 14px }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar) }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }

.lanebar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px }
.lane-chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; display: grid; gap: 1px; max-width: 70vw }

.lane-chip span { font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.lane-chip[aria-pressed="true"] { border-color: var(--tally); box-shadow: inset 0 -3px 0 var(--tally) }
.lane-chip.add { border-style: dashed; color: var(--muted) }
.inline-add { display: flex; gap: 8px }
.inline-add input { flex: 1; min-width: 0 }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em }
.crumbs button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--muted); font: inherit; text-transform: inherit; letter-spacing: inherit; text-decoration: underline; text-underline-offset: 3px }
.crumbs .cur { color: var(--ink) }
.subs { display: grid; gap: 10px }
.sub { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0 }
.sub h3 { font: 700 20px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.tag.hot { background: var(--tally); color: #fff }
.tag.reg { background: transparent; border: 1px solid var(--tally); color: var(--tally) }
.tag.lane { background: var(--ink); color: var(--bg) }
.focus-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 13px }
.focus-chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px }
.lane-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.lane-row:first-child { border-top: 0 }
.lane-row > div { min-width: 0 }
.lane-row b { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; display: block }
</style>

// ---------- storage: private db per person, else this browser ----------
const LOCAL_KEY = "shotcaller.v1";
const store = {
  mode: "local", docs: lsGet(LOCAL_KEY, {}), col: null, listeners: [], ready: false,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      this.mode = "db";
      this.docs = {};
      await new Promise(res => {
        this.col.onSnapshot(snap => {
          const next = {};
          for (const d of snap.docs) next[d.id] = { ...d.data(), id: d.id };
          this.docs = next; res(); this.emit();
        }, () => { res(); setMode(); });
      });
    } catch { this.mode = "local"; }
  },
  all(kind) { return Object.values(this.docs).filter(d => d.kind === kind).sort((a, b) => (b.created || 0) - (a.created || 0)); },
  get(id) { return this.docs[id]; },
  async put(doc) {
    const c = clone(doc); delete c.id;
    this.docs[doc.id] = { ...c, id: doc.id };
    if (this.mode === "db") { try { await this.col.doc(doc.id).set(c); } catch { toast("Couldn't save. Check your connection and try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  async del(id) {
    delete this.docs[id];
    if (this.mode === "db") { try { await this.col.doc(id).delete(); } catch { toast("Couldn't delete. Try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  emit() { this.listeners.forEach(f => f()); },
};

async function addLane(name, subs = [], activate = true) {

  const existing = lanes().find(l => same(l.name, name));
  if (existing) { if (activate) setLane(existing.id); render(); toast(`${existing.name} is already in your industries`); return existing; }
  const lane = { kind: "lane", id: uid("lane"), created: Date.now(), name, ...LANE_DEFAULTS, subs };
  if (activate) setLane(lane.id);
  await store.put(lane);
  toast(`Added ${name}`);
  return lane;
}
function editLane(lane, fn) { const next = clone(lane); fn(next); store.put(next); }
function toggleFocus(lane, sub) {
  editLane(lane, l => { l.subs = arr(l.subs); const i = l.subs.findIndex(s => same(s, sub)); if (i >= 0) l.subs.splice(i, 1); else l.subs.push(sub); });
}
const mapId = path => "map_" + slug(path.join(" > "));
async function mapIndustry(path, force) {
  path = path.map(str).filter(Boolean);
  if (!path.length) return;
  state.mapPath = path; lsSet("shotcaller.mappath", path); state.mapNote = "";
  if (state.tab !== "map") go("map");
  const id = mapId(path);
  if (store.get(id) && !force) { render(); return; }
  if (!live()) {
    const subs = path.length === 1 ? offlineMap(path[0]) : null;
    if (subs) await store.put({ kind: "map", id, path, subs, created: Date.now(), offline: true });
    else state.mapNote = sampleBlocked ? ERR.not_granted + " The built-in maps cover construction, fitness and health & hormones." : "Mapping a new industry needs Claude. Open this page in Claude to use it.";
    render(); return;
  }
  state.busy = "map"; state.ctl = new AbortController(); render();
  try {
    const out = await sample.json(mapPrompt(path), { signal: state.ctl.signal, cache: false });
    const subs = arr(Array.isArray(out) ? out : out && (out.subs || out.subniches)).map(normalizeSub).filter(s => s.name);
    if (!subs.length) throw { code: "invalid_json" };

    if (e && e.code === "cancelled") state.mapNote = "Stopped.";

// ---------- ideas & plans ----------
async function pullIdeas() {
  const lane = activeLane();
  if (!lane) { toast("Add an industry first"); const el = $("#new-lane"); if (el) el.focus(); return; }
  const p = profileOf(lane);
  const cross = state.lens === "Crossover" ? lanes().find(l => l.id === state.crossId && l.id !== lane.id) : null;
  if (state.lens === "Crossover" && !cross) { toast("Pick a second industry to cross with"); return; }
  const tagIdeas = list => list.map(i => ({ ...i, laneId: lane.id, laneName: cross ? `${lane.name} × ${cross.name}` : lane.name }));
  if (!live()) { state.batch = tagIdeas(offlineIdeas(p, state.lens, state.focus)); state.note = sampleBlocked ? ERR.not_granted : ""; render(); return; }
  state.busy = "ideas"; state.note = ""; state.ctl = new AbortController(); render();
  try {
    const avoid = store.all("idea").filter(i => i.laneId === lane.id).map(i => i.title).slice(0, 40);
    const out = await sample.json(ideasPrompt(p, state.lens, state.focus, cross ? profileOf(cross) : null, avoid), { signal: state.ctl.signal, cache: false });
    const list = arr(Array.isArray(out) ? out : out && out.ideas).map(normalizeIdea).filter(i => i.hook);
    if (!list.length) throw { code: "invalid_json" };
    state.batch = tagIdeas(list);
  } catch (e) {
    if (e && e.code === "cancelled") state.note = "Stopped.";
    else {
      if (blocked(e)) { sampleBlocked = true; setMode(); state.batch = tagIdeas(offlineIdeas(p, state.lens, state.focus)); }
      state.note = errMsg(e);
    }
  } finally { state.busy = null; state.ctl = null; render(); }
}

async function buildPlan(idea) {
  const lane = (idea.laneId && store.get(idea.laneId)) || activeLane();
  const p = profileOf(lane);
  if (idea.laneName) p.laneName = idea.laneName;
  go("plan");
  if (!live()) { const plan = offlinePlan(idea, p); await store.put(plan); setActive(plan.id); render(); return; }
  state.busy = "plan"; state.note = ""; state.ctl = new AbortController(); state.busyTitle = idea.title; render();
  try {
    const out = await sample.json(planPrompt(p, idea), { signal: state.ctl.signal, cache: false });
    const plan = normalizePlan(out || {}, idea, p);
    if (!plan.shots.length) throw { code: "invalid_json" };
    await store.put(plan); setActive(plan.id);
    toast("Plan saved to your library");
  } catch (e) {
    if (e && e.code === "cancelled") state.note = "Stopped. Your last plan is still here.";
    else {
      if (blocked(e)) { sampleBlocked = true; setMode(); const plan = offlinePlan(idea, p); await store.put(plan); setActive(plan.id); }
      state.note = errMsg(e);
    }
  } finally { state.busy = null; state.ctl = null; render(); }
}

$("#slate-date").textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
render(); setMode();

(async () => {
  await store.init();
  await migrate();
  try { sample = window.claude && window.claude.use ? await claude.use("sample") : null; } catch { sample = null; }
  setMode(); render();
})();
})();
</script>
