<style>
/* Layout: one-column phone app, clapperboard slate header, bottom tab bar (Ideas → Plan → Field → Library) */
:root {
  --bg: #EDF0EE; --surface: #FFFFFF; --ink: #14181A; --muted: #59635E; --line: #D2D8D4;
  --tally: #BF2E37; --go: #2B7552; --slate: #1C2225; --slate-ink: #F1F4F2; --chip: #E2E7E4;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101315; --surface: #191E20; --ink: #E8ECE9; --muted: #95A09A; --line: #2B3235;
  --tally: #EE5A61; --go: #58B688; --slate: #242B2E; --slate-ink: #F1F4F2; --chip: #232A2C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101315; --surface: #191E20; --ink: #E8ECE9; --muted: #95A09A; --line: #2B3235;
  --tally: #EE5A61; --go: #58B688; --slate: #242B2E; --slate-ink: #F1F4F2; --chip: #232A2C; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { margin: 0; text-wrap: balance }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px }

/* Slate header */
.slate { background: var(--slate); color: var(--slate-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 0 14px }
.sticks { height: 14px; margin-inline: -16px; background: repeating-linear-gradient(-45deg, var(--slate-ink) 0 14px, var(--slate) 14px 28px) }
.slate-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px }
.brand { font: 800 34px/0.95 var(--f-display); letter-spacing: .01em; text-transform: uppercase }
.brand b { color: var(--tally) }
.slate-meta { font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .75; text-align: right }
.mode { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; opacity: .8 }
.mode i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--go); margin-right: 6px; font-style: normal }
.mode.off i { background: #A9A9A0 }

/* Sections */
.view { display: grid; gap: 18px; padding-top: 18px }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.h-display { font: 800 30px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.h-sec { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em }
.muted { color: var(--muted) }
.small { font-size: 13px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.stack { display: grid; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }

details.lane > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px }
details.lane > summary::-webkit-details-marker { display: none }
details.lane > summary .caret { font: 500 12px var(--f-mono); color: var(--muted) }
details.lane[open] > summary { margin-bottom: 12px }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 440px) { .fields { grid-template-columns: 1fr } }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
input.t, select.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 11px; font-size: 15px; color: var(--ink) }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px }
.btn.primary { background: var(--tally); border-color: var(--tally); color: #fff }
.btn.go { background: var(--go); border-color: var(--go); color: #fff }
.btn.ghost { background: transparent }
.btn.block { width: 100% }
.btn:disabled { opacity: .55; cursor: default }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13px }

.status { font: 500 12px/1.4 var(--f-mono); color: var(--muted); display: flex; gap: 8px; align-items: center }
.rec { width: 9px; height: 9px; border-radius: 50%; background: var(--tally); animation: blink 1s steps(2) infinite }
@keyframes blink { 50% { opacity: .15 } }
@media (prefers-reduced-motion: reduce) { .rec { animation: none } }
.note { border-left: 3px solid var(--tally); padding: 8px 12px; background: var(--surface); border-radius: 0 8px 8px 0; font-size: 13px }

/* Idea cards */
.ideas { display: grid; gap: 12px }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; min-width: 0 }
.meta { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px }
.tag { font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--muted) }
.tag.ex { background: transparent; border: 1px dashed var(--muted) }
.idea h3 { font: 700 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em }
.hook { font-size: 16px; font-weight: 500; line-height: 1.35 }
.hook::before { content: "“" } .hook::after { content: "”" }

/* Plan */
.plan-head { background: var(--slate); color: var(--slate-ink); border-radius: 10px; overflow: hidden }
.plan-head .sticks { margin: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--slate-ink) 0 10px, var(--slate) 10px 20px) }
.plan-head .in { padding: 14px; display: grid; gap: 10px }
.plan-head h2 { font: 800 30px/1 var(--f-display); text-transform: uppercase }
.slate-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(241,244,242,.25) }
.slate-grid > div { padding: 8px 10px; border-right: 1px solid rgba(241,244,242,.25); min-width: 0 }
.slate-grid > div:last-child { border-right: 0 }
.slate-grid .k { font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .65 }
.slate-grid .v { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere }

.beats { display: grid }
.beat { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.beat:first-child { border-top: 0; padding-top: 0 }
.tc { font: 500 12px/1.5 var(--f-mono); color: var(--tally); font-variant-numeric: tabular-nums }
.beat .lbl { font-weight: 600 }
.beat .vis { font-size: 13px; color: var(--muted) }
.beat > div { min-width: 0 }

.shots { display: grid }
.shot { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start }
.shot:first-child { border-top: 0; padding-top: 0 }
.shot-no { font: 500 12px var(--f-mono); color: var(--muted); display: grid; gap: 4px; justify-items: start; font-variant-numeric: tabular-nums }
.size { font: 700 15px var(--f-display); letter-spacing: .04em; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 3px }
.roll { font: 500 10px var(--f-mono); text-transform: uppercase; letter-spacing: .06em }
.roll.b { color: var(--go) } .roll.a { color: var(--tally) }
.shot > div { min-width: 0 }
ul.list { margin: 0; padding-left: 18px; display: grid; gap: 4px }
.copybox { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-wrap: anywhere }

/* Field mode */
.bigline { font: 800 28px/1.05 var(--f-display); text-transform: uppercase }
.progress { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden }
.progress > i { display: block; height: 100%; background: var(--go); transition: width .25s }
.check { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; min-width: 0 }
.check input { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--go) }
.check.done { opacity: .55 }
.check.done .desc { text-decoration: line-through }
.check.next { border-color: var(--tally); box-shadow: 0 0 0 1px var(--tally) }
.check .desc { font-size: 16px; font-weight: 500 }
.check > div { min-width: 0 }

/* Library */
.lib-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line) }
.lib-item:first-child { border-top: 0 }
.lib-item > div { min-width: 0 }
.lib-item b { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; display: block }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); font-size: 14px }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar) }
nav.tabs button { background: none; border: 0; cursor: pointer; display: grid; place-content: center; gap: 2px; color: var(--muted); font: 600 12px var(--f-body) }
nav.tabs button .k { font: 700 19px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
nav.tabs button[aria-current="page"] { color: var(--ink) }
nav.tabs button[aria-current="page"] .k { color: var(--tally) }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }
</style>

<div class="wrap">

  <main id="view" class="view" aria-live="polite"></main>
</div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const str = (v, d = "") => (typeof v === "string" ? v : v == null ? d : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];
const pad = n => String(n).padStart(2, "0");
const fmtRun = s => { s = Math.max(0, Math.round(+s || 0)); return s >= 60 ? `${Math.floor(s / 60)}:${pad(s % 60)}` : `${s}s`; };
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  catch { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Text selected. Copy it from here."); }
}

// ---------- constants ----------
const LENSES = ["Surprise me", "Trend format", "Industry news", "Behind the scenes", "Teach one thing", "Myth vs fact", "Client story", "Street / on location"];
const PLATFORMS = ["TikTok / Reels / Shorts", "TikTok", "Instagram Reels", "YouTube Shorts", "YouTube long-form"];
const GOALS = ["Land clients", "Grow my audience", "Build authority", "Sell a product or service", "Get brand deals"];
const DEFAULT_PROFILE = { niche: "Local small businesses: restaurants, gyms, barbershops", audience: "Owners who need video but don't know where to start", platform: PLATFORMS[0], goal: GOALS[0], city: "" };

// ---------- examples (shown until you pull your own) ----------
const EXAMPLE_IDEAS = [
  { id: "ex1", example: true, title: "What $500 of video gets a local gym", hook: "Here's exactly what a gym gets when they hire me for one day.", format: "Behind the scenes + result reveal", angle: "Show the full day compressed: setup, shots, final edit side by side with the raw footage.", why: "Owners see the process and the price together, which answers the two questions that stop them booking.", difficulty: "Medium", runtime_sec: 45 },
  { id: "ex2", example: true, title: "3 filming mistakes every restaurant makes", hook: "If your food videos look like this, you're losing customers.", format: "Talking head + B-roll fixes", angle: "Film the bad version and the fixed version of each mistake on the same dish.", why: "Teaches something useful and quietly shows you're the fix.", difficulty: "Easy", runtime_sec: 35 },
  { id: "ex3", example: true, title: "Rating barbershop Instagrams in my city", hook: "I rated every barbershop's Instagram near me. Only one passed.", format: "Ranking / tier list", angle: "Screen-record their feeds, give each a score and one fix, then visit the winner.", why: "Local, a little spicy, and every shop you mention has a reason to share it.", difficulty: "Medium", runtime_sec: 60 },
];
const EXAMPLE_PLAN = {
  id: "explan", kind: "plan", example: true, title: "What $500 of video gets a local gym", platform: "TikTok / Reels / Shorts", runtime_sec: 45, goal: "Land clients",
  hook: { line: "Here's exactly what a gym gets when they hire me for one day.", visual: "Walk in the gym door, camera on gimbal, owner waves" },
  beats: [
    { t: "0:00–0:03", label: "Hook", script: "Here's exactly what a gym gets when they hire me for one day.", visual: "Walk-in POV through front door" },
    { t: "0:03–0:10", label: "The ask", script: "They wanted 4 Reels for the month. Here's the plan.", visual: "Shot list on phone screen, owner nodding" },
    { t: "0:10–0:30", label: "The day", script: "Coach intro, member testimonial, two workout clips. Four hours total.", visual: "Fast montage of setups, 1–2s each" },
    { t: "0:30–0:40", label: "Raw vs final", script: "This is the raw clip. This is what they posted.", visual: "Split screen raw vs graded edit" },
    { t: "0:40–0:45", label: "CTA", script: "Want this for your gym? Comment GYM and I'll send the details.", visual: "Talking head, gym floor behind" },
  ],
  shots: [
    { size: "WS", type: "A-roll", desc: "Walk-in POV through the front door", notes: "Gimbal, 0.5x lens", done: false },
    { size: "MS", type: "A-roll", desc: "Owner explaining what they want", notes: "Lav mic on owner", done: false },
    { size: "CU", type: "B-roll", desc: "Hands setting up light and tripod", notes: "Shoot 60fps for slow-mo", done: false },
    { size: "MS", type: "B-roll", desc: "Coach demoing a lift", notes: "Low angle", done: false },
    { size: "CU", type: "B-roll", desc: "Chalk on hands, barbell grip", notes: "", done: false },
    { size: "MCU", type: "A-roll", desc: "Member testimonial, one sentence", notes: "Ask: what changed since you joined?", done: false },
    { size: "OTS", type: "B-roll", desc: "Over-shoulder of you editing on laptop", notes: "Film at home after", done: false },
    { size: "MCU", type: "A-roll", desc: "Your CTA to camera on the gym floor", notes: "3 takes, different energy", done: false },
  ],
  gear: [{ item: "Phone + gimbal", done: false }, { item: "2 wireless lav mics", done: false }, { item: "1 LED panel + stand", done: false }, { item: "Charged batteries + power bank", done: false }, { item: "Signed release forms", done: false }],
  location: ["Confirm filming window when the floor is quiet (10am–12pm)", "Get verbal + written OK from every member on camera", "Check mirrors for your own reflection in wide shots"],
  caption: "One day. Four Reels. Here's what a local gym gets when they hire me.", hashtags: ["gymmarketing", "smallbusiness", "contentcreator", "behindthescenes"],
  cta: "Comment GYM and I'll send the details.", pitfalls: ["Don't show pricing you haven't confirmed with the client", "Mirror reflections ruin wide shots"],
};

// ---------- offline idea deck (used when Claude isn't available) ----------
const HOOKS = [
  n => [`Nobody in ${n} talks about this.`, "Myth vs fact"],
  n => [`I spent a day inside a ${n} business. Here's what surprised me.`, "Behind the scenes"],
  n => [`3 mistakes people make with ${n}.`, "Teach one thing"],
  n => [`Before vs after: ${n} edition.`, "Trend format"],
  n => [`Rating every ${n} spot near me.`, "Street / on location"],
  n => [`What a ${n} owner wishes you knew.`, "Client story"],
  n => [`I tried the viral ${n} hack so you don't have to.`, "Trend format"],
  n => [`5am to close: a real day in ${n}.`, "Behind the scenes"],
  n => [`The one question I ask every ${n} client first.`, "Client story"],
  n => [`Here's what changed in ${n} this year, in 30 seconds.`, "Industry news"],
  n => [`Stop doing this if you're in ${n}.`, "Myth vs fact"],
  n => [`I asked strangers what they think of ${n}.`, "Street / on location"],
];
const FORMATS = ["Talking head + B-roll", "POV walkthrough", "Before / after", "Street interview", "Day in the life", "Ranking / tier list", "Green screen reaction", "Step-by-step tutorial", "Mini documentary"];
function offlineIdeas(profile, lens) {
  const n = (profile.niche || "your industry").split(/[:,(]/)[0].trim().toLowerCase();
  let pool = HOOKS.map(f => f(n));
  if (lens && lens !== "Surprise me") pool = [...pool.filter(p => p[1] === lens), ...shuffle(pool.filter(p => p[1] !== lens))];
  else pool = shuffle(pool);
  return pool.slice(0, 6).map(([hook, cat]) => ({
    id: uid("idea"), title: hook.replace(/[.?!]$/, "").slice(0, 60), hook, format: pick(FORMATS), angle: `${cat} angle for ${profile.audience || "your audience"}.`,
    why: `Built around your goal: ${(profile.goal || "growth").toLowerCase()}.`, difficulty: pick(["Easy", "Medium"]), runtime_sec: pick([30, 45, 60]), offline: true,
  }));
}
function offlinePlan(idea, profile) {
  const r = +idea.runtime_sec || 45, c = s => Math.round(r * s);
  const tc = (a, b) => `${Math.floor(a / 60)}:${pad(a % 60)}–${Math.floor(b / 60)}:${pad(b % 60)}`;
  return normalizePlan({
    title: idea.title, platform: profile.platform, runtime_sec: r, goal: profile.goal,
    hook: { line: idea.hook, visual: "Open mid-action, face or subject in frame in the first second" },
    beats: [
      { t: tc(0, 3), label: "Hook", script: idea.hook, visual: "Tight shot, movement in frame" },
      { t: tc(3, c(.3)), label: "Setup", script: "Why this matters to the viewer, in one line.", visual: "Context wide shot" },
      { t: tc(c(.3), c(.75)), label: "Payoff", script: idea.angle, visual: "2–3 B-roll shots per point" },
      { t: tc(c(.75), c(.9)), label: "Proof", script: "Show the result or the reaction.", visual: "Result close-up" },
      { t: tc(c(.9), r), label: "CTA", script: "Tell them the one thing to do next.", visual: "Talking head" },
    ],
    shots: [
      { size: "CU", type: "A-roll", desc: "Hook line to camera, 3 takes" }, { size: "WS", type: "B-roll", desc: "Establishing shot of the location" },
      { size: "MS", type: "A-roll", desc: "Main talking segment" }, { size: "CU", type: "B-roll", desc: "Hands / product / process detail" },
      { size: "OTS", type: "B-roll", desc: "Over-the-shoulder of the work happening" }, { size: "CU", type: "B-roll", desc: "Result or reaction close-up" },
      { size: "MCU", type: "A-roll", desc: "CTA to camera" },
    ],
    gear: ["Phone + stabilizer", "Wireless mic", "Charged batteries", "Release forms if people are on camera"],
    location: ["Scout light direction before you roll", "Get permission to film on site"],
    caption: idea.title, hashtags: [], cta: "Follow for the next one.", pitfalls: ["Built-in template: connect Claude for a plan written for this exact idea"],
  }, idea);
}

// ---------- normalize model output ----------
function normalizeIdea(x) {
  return { id: uid("idea"), title: str(x.title, "Untitled idea").slice(0, 80), hook: str(x.hook), format: str(x.format), angle: str(x.angle), why: str(x.why),
    difficulty: ["Easy", "Medium", "Heavy"].includes(x.difficulty) ? x.difficulty : "Medium", runtime_sec: Math.min(900, Math.max(5, +x.runtime_sec || 45)) };
}
function normalizePlan(p, idea) {
  return {
    kind: "plan", id: uid("plan"), created: Date.now(), ideaTitle: idea ? idea.title : "",
    title: str(p.title, idea ? idea.title : "Shoot plan"), platform: str(p.platform), runtime_sec: +p.runtime_sec || 45, goal: str(p.goal),

// ---------- storage: private db per person, else this browser ----------
const LOCAL_KEY = "shotcaller.v1";
const store = {
  mode: "local", docs: lsGet(LOCAL_KEY, {}), col: null, listeners: [],
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      this.mode = "db";
      this.docs = {};
      this.col.onSnapshot(snap => {
        const next = {};
        for (const d of snap.docs) next[d.id] = { ...d.data(), id: d.id };
        this.docs = next; this.emit();
      }, () => { setMode(); });
    } catch { this.mode = "local"; }
  },
  all(kind) { return Object.values(this.docs).filter(d => d.kind === kind).sort((a, b) => (b.created || 0) - (a.created || 0)); },
  get(id) { return this.docs[id]; },
  async put(doc) {
    const clean = JSON.parse(JSON.stringify(doc)); delete clean.id;
    this.docs[doc.id] = { ...clean, id: doc.id };
    if (this.mode === "db") { try { await this.col.doc(doc.id).set(clean); } catch (e) { toast("Couldn't save. Check your connection and try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  async del(id) {
    delete this.docs[id];
    if (this.mode === "db") { try { await this.col.doc(id).delete(); } catch { toast("Couldn't delete. Try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  emit() { this.listeners.forEach(f => f()); },
};

    const list = arr(Array.isArray(out) ? out : out && out.ideas).map(normalizeIdea).filter(i => i.hook);
