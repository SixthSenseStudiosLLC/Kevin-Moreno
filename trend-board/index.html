<title>Trend Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: an idea feed fed by trends. Phone: bottom tabs, one column. Desktop: sidebar, trends rail + idea grid. */
:root {
  --bg: #F2F3F5; --surface: #FFFFFF; --ink: #15171C; --muted: #5E6470; --line: #DADDE3; --chip: #E8EAEE;
  --hot: #C8175D; --hot-soft: #FBE4EE; --star: #B7791F;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabbar: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1A1D23; --ink: #ECEEF2; --muted: #9AA1AE; --line: #2C3038; --chip: #252932;
  --hot: #F2558F; --hot-soft: #3A1827; --star: #E8B04B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1D23; --ink: #ECEEF2; --muted: #9AA1AE; --line: #2C3038; --chip: #252932;
  --hot: #F2558F; --hot-soft: #3A1827; --star: #E8B04B; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body) }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-display) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px }
.brand { font: 800 26px/1 var(--f-display); letter-spacing: -.02em }
.brand i { font-style: normal; color: var(--hot) }
.mode { font-size: 12px; color: var(--muted); text-align: right }
.view { display: grid; gap: 16px }
.h1 { font-size: 28px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800 }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) } .small { font-size: 13px }
.stack { display: grid; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 440px) { .fields { grid-template-columns: 1fr } }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0 }
.t { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; color: var(--ink) }
textarea.t { resize: vertical }
.inline { display: flex; gap: 8px } .inline .t { flex: 1; min-width: 0 }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px }
.btn.hot { background: var(--hot); border-color: var(--hot); color: #fff }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13px }
.btn.block { width: 100% }
.btn.big { min-height: 52px; font-size: 16px }
.btn:disabled { opacity: .5; cursor: default }

.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tag.hot { background: var(--hot-soft); color: var(--hot) }
.tag.ex { background: transparent; border: 1px dashed var(--muted) }

.status { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); animation: pulse 1s ease-in-out infinite alternate }
@keyframes pulse { to { opacity: .2 } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
.note { border-left: 3px solid var(--hot); background: var(--surface); border-radius: 0 10px 10px 0; padding: 9px 12px; font-size: 13px }
.empty { text-align: center; padding: 20px 10px; color: var(--muted); font-size: 14px }

/* Idea cards */
.feed { display: grid; gap: 10px }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 7px; min-width: 0; align-content: start }
.idea.starred { border-color: var(--star); box-shadow: inset 0 3px 0 var(--star) }
.idea .title { font: 700 18px/1.2 var(--f-display); letter-spacing: -.01em }
.hook { font-size: 15.5px; font-weight: 500 }
.hook::before { content: "“" } .hook::after { content: "”" }
.idea ul { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 2px }
.cap { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.star { color: var(--star) }
.batch-sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; min-width: 0 }
.batch-sep::before, .batch-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); min-width: 16px }

/* Trends */
.trend { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0 }
.trend:first-child { border-top: 0; padding-top: 0 }
.trend b { font-family: var(--f-display); font-size: 17px; line-height: 1.2 }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs .in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar) }
nav.tabs button { background: none; border: 0; cursor: pointer; font: 700 15px var(--f-display); color: var(--muted); display: grid; place-content: center; gap: 1px }
nav.tabs button span { font: 500 11px var(--f-body) }
nav.tabs button[aria-current="page"] { color: var(--hot) }
.side-brand { display: none }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }
.ideas-layout { display: grid; gap: 16px }

@media (min-width: 1000px) {
  :root { --tabbar: 0px; --side: 220px }
  .wrap { max-width: none; margin: 0 0 0 var(--side); padding-inline: 40px; padding-block: 28px 56px }
  .wrap > * { max-width: 1320px }
  .top .brand { display: none }
  .top { justify-content: flex-end; margin-bottom: 4px }
  .h1 { font-size: 36px }
  nav.tabs { top: 0; right: auto; width: var(--side); border-top: 0; border-right: 1px solid var(--line); padding: 0; display: flex; flex-direction: column }
  .side-brand { display: block; font: 800 26px/1 var(--f-display); letter-spacing: -.02em; padding: 30px 26px 26px }
  .side-brand i { font-style: normal; color: var(--hot) }
  nav.tabs .in { grid-template-columns: 1fr; grid-auto-rows: 58px; height: auto; max-width: none; margin: 0; align-content: start; padding-inline: 12px; gap: 4px }
  nav.tabs button { place-content: center start; padding-left: 16px; text-align: left; font-size: 18px; border-radius: 10px }
  nav.tabs button:hover { background: var(--bg) }
  nav.tabs button[aria-current="page"] { background: var(--hot-soft) }
  .toast { bottom: 28px; left: calc(50% + var(--side) / 2) }
  .ideas-layout { grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start }
  .rail { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto }
  .feed { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start }
  .feed > .batch-sep, .feed > .span { grid-column: 1 / -1 }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Trend<i>/</i>Board</div>
    <div class="mode" id="mode">Starting up</div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="side-brand" aria-hidden="true">Trend<i>/</i>Board</div><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const str = (v, d = "") => (typeof v === "string" ? v : v == null ? d : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];
const pad = n => String(n).padStart(2, "0");
const same = (a, b) => str(a).toLowerCase() === str(b).toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthName = () => new Date().toLocaleDateString(undefined, { month: "long" });
const daysAgo = ts => Math.max(0, Math.floor((Date.now() - (ts || 0)) / 864e5));
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Couldn't copy here. Press and hold the text to copy it."); }
}

// ---------- constants ----------
const PLATFORMS = ["TikTok", "Instagram", "Facebook", "YouTube", "Other"];
const STARTER_INDUSTRIES = ["Construction", "Landscaping", "Roofing", "Fitness", "Med spa", "Restaurants"];
const COMPLIANCE = "For health, hormones, med spa, supplements, fitness results, finance or legal: no cure, outcome, dosing or income claims.";
const FEED_MAX = 90;
const EXAMPLES = [
  { id: "ex1", example: true, trend: "Things in my job that just make sense", industry: "Roofing", title: "Roofing details that just make sense", hook: "Things on a roof that just make sense.", film: ["Nail gun sinking a perfect row, close-up", "Drip edge sliding into place", "Wide shot of clean shingle lines", "Old shingles going into the dumpster"], caption: "Tiny details, big difference. Which one got you?" },
  { id: "ex2", example: true, trend: "POV: you hired the right crew", industry: "Landscaping", title: "POV: the yard you came home to", hook: "POV: you hired the right landscaping crew.", film: ["Homeowner pulling into the driveway", "Slow reveal of the finished patio", "Crew packing up, clean site", "Homeowner's reaction"], caption: "Left for work with a mud pit. Came home to this." },
  { id: "ex3", example: true, trend: "Rating things out of 10", industry: "Fitness", title: "Coach rates gym habits out of 10", hook: "Rating your gym habits out of 10. Be honest.", film: ["Coach to camera with a scorecard", "Member skipping warm-up: 2/10", "Re-racking weights: 10/10", "Coach's final verdict"], caption: "Where do you land? Be honest in the comments." },
];

// ---------- storage: private to your Claude account, else this browser ----------
const LOCAL_KEY = "trendboard.v1";
const store = {
  mode: "local", docs: lsGet(LOCAL_KEY, {}), col: null, listeners: [],
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      this.mode = "db"; this.docs = {};
      await new Promise(res => {
        this.col.onSnapshot(snap => {
          const next = {};
          for (const d of snap.docs) next[d.id] = { ...d.data(), id: d.id };
          this.docs = next; res(); this.emit();
        }, () => res());
      });
    } catch { this.mode = "local"; }
  },
  all(kind) { return Object.values(this.docs).filter(d => d.kind === kind).sort((a, b) => (b.created || 0) - (a.created || 0)); },
  get(id) { return this.docs[id]; },
  async put(doc) {
    const c = clone(doc); delete c.id;
    this.docs[doc.id] = { ...c, id: doc.id };
    if (this.mode === "db") { try { await this.col.doc(doc.id).set(c); } catch { toast("Couldn't save. Check your connection and try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  async del(id) {
    delete this.docs[id];
    if (this.mode === "db") { try { await this.col.doc(id).delete(); } catch { toast("Couldn't delete. Try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  emit() { this.listeners.forEach(f => f()); },
};
const trends = () => store.all("trend");
const saved = () => store.all("star");
const feed = () => arr((store.get("feed") || {}).ideas);
const prefs = () => ({ industries: [], ...(store.get("prefs") || {}) });
const isStarred = i => saved().some(s => s.srcId === i.id || s.id === i.id);

// ---------- Claude ----------
let sample = null, blocked = false;
const live = () => !!sample && !blocked;
const ERR = {
  not_granted: "Claude access is off for this page. Allow it when asked to make ideas.",
  rate_limited: "Too many requests right now. Wait a minute, then try again.",
  invalid_json: "The answer came back in the wrong shape. Tap the button again.",
  refused: "Claude declined that one. Try a different trend or industry.",
};
const errMsg = e => ERR[e && e.code] || "Couldn't reach Claude. Check your connection and try again.";
const state = { tab: lsGet("trendboard.tab2", "ideas"), industry: lsGet("trendboard.ind", ""), trendId: "all", busy: null, ctl: null, note: "", showAdd: false, confirm: null };

async function ask(key, prompt) {
  if (!live()) { state.note = blocked ? ERR.not_granted : "Making ideas needs Claude. Open this page in the Claude app."; render(); return null; }
  state.busy = key; state.note = ""; state.ctl = new AbortController(); render();
  try { return await sample.json(prompt, { signal: state.ctl.signal, cache: false }); }
  catch (e) {
    if (e && ["not_granted", "sampling_disabled", "capability_disabled", "capability_removed"].includes(e.code)) { blocked = true; setMode(); }
    state.note = e && e.code === "cancelled" ? "Stopped." : errMsg(e); return null;
  } finally { state.busy = null; state.ctl = null; render(); }
}
const listOf = out => Array.isArray(out) ? out : out && (out.ideas || out.trends || out.items) || [];
const IDEA_SHAPE = `"trend" (the trend it uses), "industry" (the industry it's for), "title" (max 60 chars), "hook" (first line spoken or on screen, max 14 words), "film" (3-4 short shot lines), "caption" (ready to post, under 160 chars)`;
const normIdea = x => str(x && x.hook) ? { id: uid("gen"), trend: str(x.trend), industry: str(x.industry), title: str(x.title, "Clip idea").slice(0, 80), hook: str(x.hook), film: arr(x.film).map(str).filter(Boolean).slice(0, 5), caption: str(x.caption) } : null;
const avoid = () => [...feed(), ...saved()].slice(0, 40).map(i => i.title);
const industryLine = () => state.industry ? `Make every idea for this industry: ${state.industry}.` : `Spread ideas across local businesses the creator might film: ${[...new Set([...prefs().industries, ...STARTER_INDUSTRIES])].slice(0, 6).join(", ")}.`;

async function pushFeed(ideas, label) {
  const batch = ideas.map(i => ({ ...i, batch: label }));
  await store.put({ kind: "feed", id: "feed", ideas: [...batch, ...feed()].slice(0, FEED_MAX) });
}

async function moreIdeas() {
  const ts = state.trendId === "all" ? trends().slice(0, 12) : trends().filter(t => t.id === state.trendId);
  const out = await ask("more", `You are a short-form strategist feeding a videographer a constant stream of clip ideas. They film on location for local businesses with a phone and one mic, so every clip must be shootable on-site in about 15 minutes.

${industryLine()}

${ts.length ? `Trends to build from${ts.length > 1 ? " (use a mix, and name the one each idea uses)" : ""}:\n${ts.map((t, i) => `${i + 1}. ${t.name}: ${t.what}`).join("\n")}` : "No trends logged, so use short-form formats you know are reliably working on TikTok, Instagram Reels and Facebook Reels, and name the format as the trend."}

Give 6 fresh ideas. Keep what makes each trend recognizable (structure, phrasing, on-screen text) and make it about the real work in the industry. Vary the formats and angles. Hooks should sound like a person, not an ad.
Don't repeat any of these: ${avoid().join(" | ") || "none"}
${COMPLIANCE}

Reply with ONLY a JSON array of 6 objects: ${IDEA_SHAPE}.`);
  if (!out) return;
  const ideas = listOf(out).map(normIdea).filter(Boolean);
  if (!ideas.length) { state.note = ERR.invalid_json; render(); return; }
  await pushFeed(ideas, [state.industry || "Mixed industries", state.trendId === "all" ? (ts.length ? "all trends" : "working formats") : ts[0].name].join(" · "));
}

async function likeThis(i) {
  const out = await ask("like_" + i.id, `You are a short-form strategist. The creator liked this clip idea and wants 3 more in the same spirit, each a clear variation (different angle, setting, or twist), still built on the same trend and industry.

Trend: ${i.trend || "none named"}
Industry: ${i.industry || state.industry || "local business"}
Idea: ${i.title}. Hook: ${i.hook}. Shots: ${arr(i.film).join("; ")}

Don't repeat: ${avoid().join(" | ")}
${COMPLIANCE}

Reply with ONLY a JSON array of 3 objects: ${IDEA_SHAPE}.`);
  if (!out) return;
  const ideas = listOf(out).map(normIdea).filter(Boolean);
  if (!ideas.length) { state.note = ERR.invalid_json; render(); return; }
  await pushFeed(ideas, `More like “${i.title}”`);
  if (state.tab !== "ideas") go("ideas"); else scrollTo({ top: 0, behavior: "smooth" });
}

async function findTrends() {
  const out = await ask("find", `You help a videographer who films short-form content for local businesses find trends to build clips on in ${monthName()} ${new Date().getFullYear()}.
Industries they film: ${[state.industry, ...prefs().industries].filter(Boolean).join(", ") || "local service businesses (construction, trades, fitness, health, restaurants)"}.

List 8 trends:
- 5 short-form formats that are reliably working on TikTok, Instagram Reels and Facebook Reels as far as you know (recognizable structures, text-on-screen formats, POV styles, challenges).
- 3 moments specific to ${monthName()}: holidays, awareness months, or seasonal customer demand.
You can't see live platform data, so don't name a specific sound or claim numbers. Describe each so a creator could recreate it.

Reply with ONLY a JSON array of 8 objects: "name" (what people would call it, max 50 chars), "what" (1-2 sentences: what happens in it), "kind" ("Format" or "${monthName()}").`);
  if (!out) return;
  const list = listOf(out).filter(x => x && str(x.name) && str(x.what));
  if (!list.length) { state.note = ERR.invalid_json; render(); return; }
  const base = Date.now();
  for (const [n, x] of list.entries()) await store.put({ kind: "trend", id: uid("trend"), created: base - n, name: str(x.name).slice(0, 70), what: str(x.what), found: str(x.kind) || "Format", month: thisMonth() });
  toast(`${list.length} trends added`);
}

function setIndustry(v) {
  state.industry = str(v); lsSet("trendboard.ind", state.industry);
  if (state.industry && !prefs().industries.some(x => same(x, state.industry)))
    store.put({ kind: "prefs", id: "prefs", ...prefs(), industries: [state.industry, ...prefs().industries].slice(0, 12) });
  render();
}
async function star(i) {
  const hit = saved().find(s => s.srcId === i.id || s.id === i.id);
  if (hit) { await store.del(hit.id); toast("Removed from saved"); return; }
  const doc = { ...i, kind: "star", id: uid("star"), srcId: i.id, created: Date.now() }; delete doc.example; delete doc.batch;
  await store.put(doc); toast("Saved");
}
const ideaText = i => [i.title, `Hook: ${i.hook}`, ...arr(i.film).map(f => "• " + f), i.caption ? `Caption: ${i.caption}` : ""].filter(Boolean).join("\n");

// ---------- views ----------
function go(tab) { state.tab = tab; lsSet("trendboard.tab2", tab); state.note = ""; render(); scrollTo({ top: 0 }); }
const busyRow = text => h("div", { class: "row between span" }, h("div", { class: "status" }, h("span", { class: "pulse" }), text), h("button", { class: "btn sm", onclick: () => state.ctl && state.ctl.abort() }, "Stop"));
const noteEl = () => state.note ? h("div", { class: "note span", text: state.note }) : null;

function ideaCard(i) {
  const st = !i.example && isStarred(i), busy = state.busy === "like_" + i.id;
  return h("article", { class: "idea" + (st ? " starred" : "") },
    h("div", { class: "row", style: "gap:6px" }, i.example ? h("span", { class: "tag ex", text: "Example" }) : null, i.trend ? h("span", { class: "tag hot", text: i.trend }) : null, i.industry ? h("span", { class: "tag", text: i.industry }) : null),
    h("div", { class: "title", text: i.title }),
    h("div", { class: "hook", text: i.hook }),
    arr(i.film).length ? h("ul", null, i.film.map(f => h("li", { text: f }))) : null,
    i.caption ? h("div", { class: "cap", text: i.caption }) : null,
    busy ? busyRow("Writing 3 more like this…") : h("div", { class: "row", style: "gap:4px" },
      i.example ? null : h("button", { class: "btn sm", "aria-pressed": String(st), onclick: () => star(i) }, st ? h("span", { class: "star", text: "★ Saved" }) : "☆ Save"),
      i.example ? null : h("button", { class: "btn sm ghost", disabled: state.busy || null, onclick: () => likeThis(i) }, "More like this"),
      h("button", { class: "btn sm ghost", onclick: () => copy(ideaText(i)) }, "Copy")));
}

function controls() {
  const ts = trends();
  const inds = [...prefs().industries, ...STARTER_INDUSTRIES].filter((x, i, a) => a.findIndex(y => same(x, y)) === i).slice(0, 10);
  const submitInd = e => { e.preventDefault(); setIndustry(val("ind")); };
  return h("div", { class: "stack" },
    h("div", { class: "label", text: "Ideas for" }),
    h("form", { class: "inline", onsubmit: submitInd },
      h("input", { class: "t", id: "ind", value: state.industry, placeholder: "Any industry, e.g. hardscaping", autocomplete: "off", "aria-label": "Industry" }),
      h("button", { class: "btn", type: "submit" }, "Set")),
    h("div", { class: "chips" },
      h("button", { class: "chip", "aria-pressed": String(!state.industry), onclick: () => setIndustry("") }, "Mixed"),
      inds.map(x => h("button", { class: "chip", "aria-pressed": String(same(x, state.industry)), onclick: () => setIndustry(x) }, x))),
    h("div", { class: "label", style: "margin-top:6px", text: "From" }),
    h("div", { class: "chips" },
      h("button", { class: "chip", "aria-pressed": String(state.trendId === "all"), onclick: () => { state.trendId = "all"; render(); } }, ts.length ? `All trends (${ts.length})` : "Working formats"),
      ts.slice(0, 14).map(t => h("button", { class: "chip", title: t.what, "aria-pressed": String(state.trendId === t.id), onclick: () => { state.trendId = t.id; render(); } }, t.name))),
    h("button", { class: "btn sm ghost", style: "justify-self:start;padding-left:0", onclick: () => go("trends") }, ts.length ? "Manage trends ›" : "+ Add trends ›"));
}

function viewIdeas() {
  const f = feed(), busy = state.busy === "more";
  const cards = []; let last = null;
  for (const i of f) { if (i.batch !== last) { cards.push(h("div", { class: "batch-sep", text: i.batch || "Ideas" })); last = i.batch; } cards.push(ideaCard(i)); }
  const moreBtn = busy ? busyRow("Writing 6 ideas… about 20 seconds") :
    h("button", { class: "btn hot big block span", disabled: state.busy || null, onclick: moreIdeas }, f.length ? "More ideas" : "Start the ideas");
  return [
    h("div", { class: "stack" }, h("h1", { class: "h1", text: "Ideas, on tap" }),
      h("p", { class: "muted small", style: "margin:0", text: "Pick an industry and a trend, or leave both open. Every tap gives you 6 new clip ideas. Star the keepers." })),
    h("div", { class: "ideas-layout" },
      h("aside", { class: "rail panel" }, controls()),
      h("section", { class: "feed" },
        moreBtn, noteEl(),
        f.length ? cards : [h("div", { class: "batch-sep", text: "Examples" }), EXAMPLES.map(ideaCard)],
        f.length > 6 && !busy ? h("button", { class: "btn block span", disabled: state.busy || null, onclick: () => { scrollTo({ top: 0, behavior: "smooth" }); moreIdeas(); } }, "More ideas") : null,
        f.length ? h("button", { class: "btn sm ghost span", style: "justify-self:center", onclick: () => { if (state.confirm === "feed") { state.confirm = null; store.put({ kind: "feed", id: "feed", ideas: [] }); } else { state.confirm = "feed"; render(); } } }, state.confirm === "feed" ? "Tap again to clear the feed (saved ideas stay)" : "Clear feed") : null)),
  ];
}

function viewTrends() {
  const ts = trends(), busy = state.busy === "find";
  const submit = e => {
    e.preventDefault();
    const name = val("t-name"), what = val("t-what");
    if (!name || !what) { toast("Add the trend's name and what happens in it"); return; }
    state.showAdd = false;
    store.put({ kind: "trend", id: uid("trend"), created: Date.now(), name, what, platform: val("t-plat"), link: val("t-link") });
    toast("Trend added");
  };
  return [
    h("div", { class: "stack" }, h("h1", { class: "h1", text: "Trends" }),
      h("p", { class: "muted small", style: "margin:0", text: "Everything here feeds your ideas. Add what you see in your feed, or let Claude suggest formats and this month's moments." })),
    h("div", { class: "row" },
      h("button", { class: "btn hot", style: "flex:1", onclick: () => { state.showAdd = !state.showAdd; render(); } }, state.showAdd ? "Close" : "+ Add a trend I saw"),
      busy ? null : h("button", { class: "btn", style: "flex:1", disabled: state.busy || null, onclick: findTrends }, `Find ${monthName()} trends`)),
    busy ? busyRow(`Finding ${monthName()} trends… about 30 seconds`) : null,
    noteEl(),
    state.showAdd ? h("form", { class: "panel stack", onsubmit: submit },
      h("div", { class: "fields" },
        h("label", { class: "f full" }, "What people call it", h("input", { class: "t", id: "t-name", placeholder: "e.g. “Things in my job that just make sense”", autocomplete: "off" })),
        h("label", { class: "f full" }, "What happens in it", h("textarea", { class: "t", id: "t-what", rows: "3", placeholder: "The format, the sound, the text on screen" })),
        h("label", { class: "f" }, "Where you saw it", h("select", { class: "t", id: "t-plat" }, PLATFORMS.map(p => h("option", { value: p }, p)))),
        h("label", { class: "f" }, "Link (optional)", h("input", { class: "t", id: "t-link", type: "url", placeholder: "https://" }))),
      h("button", { class: "btn hot", type: "submit" }, "Add trend")) : null,
    ts.length ? h("section", { class: "panel" }, ts.map(t => h("div", { class: "trend" },
      h("div", { class: "row between" }, h("b", { text: t.name }),
        h("div", { class: "row", style: "gap:4px" }, h("span", { class: "tag hot", text: t.found || t.platform || "Trend" }), h("span", { class: "tag", text: daysAgo(t.created) === 0 ? "Today" : `${daysAgo(t.created)}d ago` }))),
      h("div", { class: "small", text: t.what }),
      t.link && /^https?:\/\//.test(t.link) ? h("a", { href: t.link, target: "_blank", rel: "noopener", class: "small", style: "color:var(--hot);overflow-wrap:anywhere", text: t.link }) : null,
      h("div", { class: "row", style: "gap:4px" },
        h("button", { class: "btn sm hot", disabled: state.busy || null, onclick: () => { state.trendId = t.id; go("ideas"); moreIdeas(); } }, "Ideas from this"),
        h("button", { class: "btn sm ghost", onclick: () => { if (state.confirm === t.id) { state.confirm = null; if (state.trendId === t.id) state.trendId = "all"; store.del(t.id); } else { state.confirm = t.id; render(); } } }, state.confirm === t.id ? "Tap to remove" : "Remove")))))
      : h("div", { class: "empty", text: "No trends yet. Without any, ideas come from formats Claude knows are working. Add the ones you spot to make them fresher." }),
    ts.length ? h("p", { class: "small muted", style: "margin:0", text: "Found trends come from what Claude knows, not live feeds. The ones you spot yourself are always the freshest." }) : null,
  ];
}

function viewSaved() {
  const list = saved();
  return [
    h("div", { class: "row between" }, h("h1", { class: "h1", text: "Saved" }),
      list.length ? h("button", { class: "btn sm", onclick: () => copy(list.map((i, n) => `${n + 1}. ${ideaText(i)}`).join("\n\n")) }, "Copy all") : null),
    list.length ? h("section", { class: "feed" }, list.map(ideaCard)) : h("div", { class: "empty", text: "Star ideas in your feed and they'll collect here." }),
  ];
}

const TABS = [["ideas", "Ideas", "Feed"], ["trends", "Trends", "Sources"], ["saved", "Saved", "Starred"]];
function render() {
  const active = document.activeElement && document.activeElement.id;
  const views = { ideas: viewIdeas, trends: viewTrends, saved: viewSaved };
  $("#view").replaceChildren(...[].concat((views[state.tab] || viewIdeas)()).flat(Infinity).filter(Boolean));
  $("#tabs").replaceChildren(...TABS.map(([k, label, sub]) => h("button", { "aria-current": state.tab === k ? "page" : null, onclick: () => go(k) }, k === "saved" && saved().length ? `${label} · ${saved().length}` : label, h("span", { text: sub }))));
  if (active) { const el = document.getElementById(active); if (el && el !== document.activeElement) el.focus(); }
}
function setMode() { $("#mode").textContent = (live() ? "Claude on" : "Claude off") + " · " + (store.mode === "db" ? "saved to your account" : "saved on this device"); }

store.listeners.push(() => { const a = document.activeElement; if (a && a.matches && a.matches("input.t, textarea.t, select.t")) return; render(); });
render(); setMode();
(async () => {
  await store.init();
  try { sample = window.claude && window.claude.use ? await claude.use("sample") : null; } catch { sample = null; }
  setMode(); render();
})();
})();
</script>
