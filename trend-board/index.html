<title>Trend Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Trends feed → pick clients → ideas → client clip banks. Bottom tabs. */
:root {
  --bg: #F2F3F5; --surface: #FFFFFF; --ink: #15171C; --muted: #5E6470; --line: #DADDE3; --chip: #E8EAEE;
  --hot: #C8175D; --hot-soft: #FBE4EE; --keep: #1F7A5C; --keep-soft: #DFF1EA;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabbar: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1A1D23; --ink: #ECEEF2; --muted: #9AA1AE; --line: #2C3038; --chip: #252932;
  --hot: #F2558F; --hot-soft: #3A1827; --keep: #4FC49A; --keep-soft: #16302A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1D23; --ink: #ECEEF2; --muted: #9AA1AE; --line: #2C3038; --chip: #252932;
  --hot: #F2558F; --hot-soft: #3A1827; --keep: #4FC49A; --keep-soft: #16302A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body) }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-display) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px }
.brand { font: 800 26px/1 var(--f-display); letter-spacing: -.02em }
.brand i { font-style: normal; color: var(--hot) }
.mode { font-size: 12px; color: var(--muted); text-align: right }
.view { display: grid; gap: 16px }
.h1 { font-size: 28px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800 }
.h2 { font-size: 19px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) } .small { font-size: 13px }
.stack { display: grid; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 440px) { .fields { grid-template-columns: 1fr } }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0 }
.t { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; color: var(--ink) }
textarea.t { resize: vertical }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px }
.btn.hot { background: var(--hot); border-color: var(--hot); color: #fff }
.btn.keep { background: var(--keep); border-color: var(--keep); color: #fff }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13px }
.btn.block { width: 100% }
.btn:disabled { opacity: .5; cursor: default }

.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted) }
.tag.hot { background: var(--hot-soft); color: var(--hot) }
.tag.keep { background: var(--keep-soft); color: var(--keep) }
.tag.ex { background: transparent; border: 1px dashed var(--muted) }

.status { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); animation: pulse 1s ease-in-out infinite alternate }
@keyframes pulse { to { opacity: .2 } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
.note { border-left: 3px solid var(--hot); background: var(--surface); border-radius: 0 10px 10px 0; padding: 9px 12px; font-size: 13px }
.empty { text-align: center; padding: 20px 10px; color: var(--muted); font-size: 14px }

/* Trend cards */
.trend { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0 }
.trend h3 { font-size: 21px; line-height: 1.1; font-weight: 800; letter-spacing: -.015em }
.trend .for { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line) }
.group { display: grid; gap: 8px; padding-top: 8px }
.group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.group-head b { font-family: var(--f-display); font-size: 16px }

/* Idea */
.idea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--bg); min-width: 0 }
.idea.saved { border-color: var(--keep); background: var(--keep-soft) }
.idea.done { opacity: .6 }
.idea .title { font-weight: 700; font-size: 15.5px; line-height: 1.25 }
.hook { font-size: 15px; font-weight: 500 }
.hook::before { content: "“" } .hook::after { content: "”" }
.idea ul { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 2px }
.cap { font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere }

/* Clients */
.client { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line) }
.client:first-child { border-top: 0; padding-top: 0 }
.client > div { min-width: 0 }
.client b { font-family: var(--f-display); font-size: 18px; display: block }
.meter { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 6px }
.meter > i { display: block; height: 100%; background: var(--keep) }
.back { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; justify-self: start }
.pillar { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line) }
.pillar:first-of-type { border-top: 0; padding-top: 0 }
.pillar-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline }
.pillar-head b { font-family: var(--f-display); font-size: 18px; line-height: 1.15 }
.count { font: 800 22px/1 var(--f-display); color: var(--hot); font-variant-numeric: tabular-nums }
.mix { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px }
.mix i { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block }
ol.qs, ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 14px }
.svc { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line) }
.svc:first-of-type { border-top: 0; padding-top: 0 }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs .in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar) }
nav.tabs button { background: none; border: 0; cursor: pointer; font: 700 15px var(--f-display); color: var(--muted); display: grid; place-content: center; gap: 1px }
nav.tabs button span { font: 500 11px var(--f-body) }
nav.tabs button[aria-current="page"] { color: var(--hot) }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Trend<i>/</i>Board</div>
    <div class="mode" id="mode">Starting up</div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const str = (v, d = "") => (typeof v === "string" ? v : v == null ? d : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];
const pad = n => String(n).padStart(2, "0");
const same = (a, b) => str(a).toLowerCase() === str(b).toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthName = (m = thisMonth()) => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString(undefined, { month: "long" });
const daysAgo = ts => Math.max(0, Math.floor((Date.now() - (ts || 0)) / 864e5));
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Couldn't copy here. Press and hold the text to copy it."); }
}

// ---------- constants ----------
const PLATFORMS = ["TikTok", "Instagram", "Facebook", "YouTube", "Other"];
const COMPLIANCE = "If a client is in health, hormones, med spa, supplements, fitness results, finance or legal: no cure, outcome, dosing or income claims, and point viewers to a licensed provider where it matters.";
const EXAMPLE_TREND = {
  id: "ex_trend", example: true, kind: "trend", platform: "TikTok", name: "“Things in my job that just make sense”",
  what: "Quick cuts of small, satisfying details from someone's work with on-screen text, set to a calm trending sound.",
  ideas: [
    { clientName: "Summit Roofing (example)", title: "Roofing details that just make sense", hook: "Things on a roof that just make sense.", film: ["Close-up: nail gun sinking a perfect row", "Drip edge sliding into place", "Drone or ladder shot of clean shingle lines", "Crew tossing old shingles into the dumpster"], caption: "Tiny details, big difference. Which one got you?", why: "Satisfying B-roll you can grab on any job in 10 minutes." },
    { clientName: "Iron Temple Gym (example)", title: "Gym things that just make sense", hook: "Things in this gym that just make sense.", film: ["Plates racked by weight, slow pan", "Chalk bowl refill close-up", "Coach fixing a squat with one cue", "Towel folded on every bench"], caption: "The small stuff is why members stay.", why: "Shows the gym's standards without a sales pitch." },
  ],
};

// ---------- storage: private db per person, else this browser ----------
const LOCAL_KEY = "trendboard.v1";
const store = {
  mode: "local", docs: lsGet(LOCAL_KEY, {}), col: null, listeners: [],
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      this.mode = "db"; this.docs = {};
      await new Promise(res => {
        this.col.onSnapshot(snap => {
          const next = {};
          for (const d of snap.docs) next[d.id] = { ...d.data(), id: d.id };
          this.docs = next; res(); this.emit();
        }, () => res());
      });
    } catch { this.mode = "local"; }
  },
  all(kind) { return Object.values(this.docs).filter(d => d.kind === kind).sort((a, b) => (b.created || 0) - (a.created || 0)); },
  get(id) { return this.docs[id]; },
  async put(doc) {
    const c = clone(doc); delete c.id;
    this.docs[doc.id] = { ...c, id: doc.id };
    if (this.mode === "db") { try { await this.col.doc(doc.id).set(c); } catch { toast("Couldn't save. Check your connection and try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  async del(id) {
    delete this.docs[id];
    if (this.mode === "db") { try { await this.col.doc(id).delete(); } catch { toast("Couldn't delete. Try again."); } }
    else lsSet(LOCAL_KEY, this.docs);
    this.emit();
  },
  emit() { this.listeners.forEach(f => f()); },
};
const edit = (doc, fn) => { const next = clone(doc); fn(next); return store.put(next); };
const clients = () => store.all("client").sort((a, b) => str(a.name).localeCompare(str(b.name)));
const trends = () => store.all("trend");
const saved = () => store.all("idea");
const savedThisMonth = cid => saved().filter(i => i.clientId === cid && i.month === thisMonth());

// ---------- Claude ----------
let sample = null, blocked = false;
const live = () => !!sample && !blocked;
const ERR = {
  not_granted: "Claude access is off for this page. Allow it when asked to generate ideas.",
  rate_limited: "Too many requests right now. Wait a minute, then try again.",
  invalid_json: "The answer came back in the wrong shape. Tap the button again.",
  refused: "Claude declined that one. Reword the trend and try again.",
};
const errMsg = e => ERR[e && e.code] || "Couldn't reach Claude. Check your connection and try again.";
const state = { tab: lsGet("trendboard.tab", "trends"), pick: {}, busy: null, ctl: null, note: "", noteFor: null, bankClient: "all", editClient: null, showAdd: false, clientView: null };

async function ask(key, prompt) {
  if (!live()) { state.note = blocked ? ERR.not_granted : "Generating ideas needs Claude. Open this page in the Claude app."; state.noteFor = key; render(); return null; }
  state.busy = key; state.note = ""; state.noteFor = null; state.ctl = new AbortController(); render();
  try { return await sample.json(prompt, { signal: state.ctl.signal, cache: false }); }
  catch (e) {
    if (e && ["not_granted", "sampling_disabled", "capability_disabled", "capability_removed"].includes(e.code)) { blocked = true; setMode(); }
    state.note = e && e.code === "cancelled" ? "Stopped." : errMsg(e); state.noteFor = key; return null;
  } finally { state.busy = null; state.ctl = null; render(); }
}
const listOf = out => Array.isArray(out) ? out : out && (out.ideas || out.trends || out.items) || [];
const productList = c => str(c.products).split(/\n+/).map(str).filter(Boolean);
const clientBlock = c => `- ${c.name}: ${c.industry || "industry not set"}. Sells: ${c.sells || "not set"}. Audience: ${c.audience || "not set"}. Notes: ${c.notes || "none"}.${
  productList(c).length ? ` Products: ${productList(c).slice(0, 15).join(", ")}.` : ""}${
  c.goals ? ` Content the creator wants to make for them: ${c.goals}.` : ""}${
  c.breakdown ? ` Content pillars: ${arr(c.breakdown.pillars).map(p => p.name).join(", ")}.` : ""}`;
const IDEA_SHAPE = `"clientName" (exactly as written above), "title" (max 60 chars), "hook" (first line spoken or on screen, max 14 words), "film" (3-4 short shot lines: what to film on-site), "caption" (ready to post, under 180 chars), "why" (1 short sentence: why it works for this client)`;
function normIdea(x, cs) {
  const c = cs.find(c => same(c.name, x.clientName)) || (cs.length === 1 ? cs[0] : null);
  if (!c || !str(x.hook)) return null;
  return { clientId: c.id, clientName: c.name, title: str(x.title, "Clip idea").slice(0, 80), hook: str(x.hook), film: arr(x.film).map(str).filter(Boolean).slice(0, 5), caption: str(x.caption), why: str(x.why) };
}
const avoidFor = cs => saved().filter(i => cs.some(c => c.id === i.clientId)).slice(0, 40).map(i => i.title);

async function ideasForTrend(t, cs, per = 3) {
  const out = await ask(t.id, `You are a short-form strategist for a videographer who films monthly retainer content for local businesses (about 12 clips per client per month, filmed on-site in batches).

Trend${t.platform ? ` spotted on ${t.platform}` : ""}: ${t.name}
What happens in it: ${t.what}

Turn this trend into ${per} clip ideas for EACH client below. Keep what makes the trend recognizable (structure, phrasing, sound style, on-screen text) and make it about the client's real business. Every clip must be filmable at the client's location in about 15 minutes. If the trend truly doesn't fit a client, give fewer for them rather than forcing it.

Clients:
${cs.map(clientBlock).join("\n")}

Don't repeat these saved ideas: ${avoidFor(cs).join(" | ") || "none"}
${COMPLIANCE}

Reply with ONLY a JSON array of objects: ${IDEA_SHAPE}.`);
  if (!out) return;
  const ideas = listOf(out).map(x => normIdea(x, cs)).filter(Boolean);
  if (!ideas.length) { state.note = ERR.invalid_json; state.noteFor = t.id; render(); return; }
  const keep = arr(t.ideas).filter(i => !cs.some(c => c.id === i.clientId));
  await edit(t, d => { d.ideas = [...keep, ...ideas.map(i => ({ ...i, id: uid("gen") }))]; });
}

async function findTrends() {
  const cs = clients();
  const out = await ask("find", `You help a videographer who makes monthly retainer content for local businesses find trends to build clips on for ${monthName()} ${new Date().getFullYear()}.

Their clients:
${cs.length ? cs.map(clientBlock).join("\n") : "- No clients added yet; think local service businesses in general."}

List 8 trends to work from this month:
- 4 short-form formats that are reliably working on TikTok, Instagram Reels and Facebook Reels right now as far as you know (recognizable structures, text-on-screen formats, POV styles, challenge formats).
- 4 moments specific to ${monthName()}: holidays, awareness months, seasonal demand or customer worries that fit these clients' industries.
You can't see live platform data, so don't name a specific sound or claim numbers. Describe each so a creator could recreate it.

Reply with ONLY a JSON array of 8 objects: "name" (what people would call it, max 50 chars), "what" (1-2 sentences: what happens in it), "kind" ("Format" or "${monthName()}").`);
  if (!out) return;
  const list = listOf(out).filter(x => x && str(x.name) && str(x.what));
  if (!list.length) { state.note = ERR.invalid_json; state.noteFor = "find"; render(); return; }
  const base = Date.now(); let n = 0;
  for (const x of list) await store.put({ kind: "trend", id: uid("trend"), created: base - n++, name: str(x.name).slice(0, 70), what: str(x.what), platform: "", found: str(x.kind) || "Format", month: thisMonth(), ideas: [] });
  toast(`${list.length} trends added`);
}

async function fillMonth(c) {
  const need = Math.max(1, (+c.clips || 12) - savedThisMonth(c.id).length);
  const ts = trends().filter(t => daysAgo(t.created) <= 35).slice(0, 12);
  const mix = c.breakdown ? arr(c.breakdown.pillars) : [];
  if (!ts.length && !mix.length) { toast("Add trends or break down this client first"); go("trends"); return; }
  const out = await ask("fill_" + c.id, `You are a short-form strategist for a videographer. ${c.name} is a monthly retainer client and still needs ${need} clip ideas for ${monthName()}.

Client:
${clientBlock(c)}

${mix.length ? `Follow their monthly content mix (scale to ${need} clips): ${mix.map(p => `${p.name} ${p.per_month}`).join(", ")}. Product education clips should each teach one clear thing about one product.\n` : ""}${ts.length ? `Trends to build from (use them where they fit; name the one each idea uses, or "" if none):
${ts.map((t, i) => `${i + 1}. ${t.name}: ${t.what}`).join("\n")}
` : ""}
Every clip must be filmable at ${c.name}'s location, and the whole set should be shootable in 1-2 visits. Mix formats so the month doesn't feel repetitive.
Don't repeat: ${avoidFor([c]).join(" | ") || "none"}
${COMPLIANCE}

Reply with ONLY a JSON array of ${need} objects: ${IDEA_SHAPE}, "trend" (the trend name it uses, or the content pillar if no trend).`);
  if (!out) return;
  const ideas = listOf(out).map(x => { const i = normIdea({ ...x, clientName: c.name }, [c]); return i && { ...i, trend: str(x.trend) }; }).filter(Boolean);
  if (!ideas.length) { state.note = ERR.invalid_json; state.noteFor = "fill_" + c.id; render(); return; }
  for (const i of ideas) await saveIdea(i, true);
  toast(`${ideas.length} ideas added to ${c.name}`);
  state.bankClient = c.id; go("bank");
}

async function breakDown(c) {
  const clips = +c.clips || 12;
  const out = await ask("bd_" + c.id, `You are a content strategist for a videographer who sells monthly video retainers (${clips} short-form clips a month, filmed on-site) to local businesses. They also offer business-owner podcasts. Break down how they can help this client grow with video, so they can plan the work and pitch it.

Client: ${c.name}
Industry: ${c.industry || "not set"}
What they sell: ${c.sells || "not set"}
Customers: ${c.audience || "not set"}
Notes: ${c.notes || "none"}
Products / services (one per line):
${productList(c).join("\n") || "none listed"}

What the creator wants to do for them: ${c.goals || "not said"}

Everything else the creator gathered (website copy, call notes, reviews):
${str(c.info).slice(0, 7000) || "nothing yet"}

Use only what's above for facts about the company. Don't invent products, prices, awards or history; if something is unknown, say so in "gaps" or ask it in "questions".
${COMPLIANCE}

An IDEA is {"title" (max 60 chars), "hook" (max 14 words), "film" (3-4 short shot lines), "caption" (under 180 chars), "why" (1 sentence)}.

Reply with ONLY a JSON object:
"snapshot": {"what" (1-2 sentences), "customers" (1 sentence), "edge" (what sets them apart, 1 sentence), "gaps" (2-3 things their video/social is probably missing)},
"pillars": 3-5 content pillars that make up the monthly mix, each {"name", "why" (1 sentence), "per_month" (number of clips; all pillars add up to exactly ${clips}), "ideas" (2 IDEAs)},
"product_series": 4-8 educational reels, one product each, each {"product", "angle" (e.g. how to choose, common mistake, how it's installed, vs the alternative, how to care for it), "idea" (1 IDEA)},
"services": 3-5 other ways the creator can help beyond the monthly clips, each {"name", "why" (1 sentence), "pitch" (1 sentence the creator could say to the owner)},
"questions": 5-8 questions to ask the client at the next meeting to make the content better.`);
  if (!out || typeof out !== "object") return;
  const idea = x => x && str(x.hook) ? { id: uid("gen"), clientId: c.id, clientName: c.name, title: str(x.title, "Clip idea").slice(0, 80), hook: str(x.hook), film: arr(x.film).map(str).filter(Boolean).slice(0, 5), caption: str(x.caption), why: str(x.why) } : null;

  $("#tabs").replaceChildren(...TABS.map(([k, label, sub]) => h("button", { "aria-current": state.tab === k ? "page" : null, onclick: () => go(k) }, label, h("span", { text: sub }))));
  if (active) { const el = document.getElementById(active); if (el && el !== document.activeElement) el.focus(); }
}
function setMode() { $("#mode").textContent = (live() ? "Claude on" : "Claude off") + " · " + (store.mode === "db" ? "saved to your account" : "saved on this device"); }

store.listeners.push(() => { const a = document.activeElement; if (a && a.matches && a.matches("input.t, textarea.t, select.t")) return; render(); });
render(); setMode();
(async () => {
  await store.init();
  try { sample = window.claude && window.claude.use ? await claude.use("sample") : null; } catch { sample = null; }
  setMode(); render();
})();
})();
</script>
